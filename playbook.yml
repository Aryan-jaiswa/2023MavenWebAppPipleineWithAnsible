---
- name: Deploy to Tomcat
  hosts: web
  become: yes
  tasks: 
   - name: copy WAR file to Tomcat
     copy:
     src: "target/MavenAnsibleWebApp.war"
     dest: "/opt/tomcat/webapps/2023MavenWebAppPipelineWithAnsible.war"
     remote_src: no
     
   - name: Restart Tomcat
     systemd: 
       name: tomcat
       state: restarted
