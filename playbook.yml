- name: Deploy to Tomcat
  hosts: web
  become: yes

  tasks:
    - name: Copy WAR file to Tomcat
      copy:
        src: "/var/snap/jenkins/5013/workspace/2023MavenWebAppPipleineWithAnsible"
        dest: "/opt/tomcat/webapps/MavenAnsibleWebApp.war"

    - name: Restart Tomcat
      systemd:
        name: tomcat
        state: restarted
